<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <!-- Sacred Geometry Background Elements -->
  <g transform="translate(60, 60)">
    <polygon points="0,48 -44,-28 44,-28" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
    <polygon points="0,-48 42,26 -42,26" stroke="#10B981" stroke-width="1.2" opacity="0.3"/>
    <circle cx="0" cy="0" r="46" stroke="#4F46E5" stroke-width="1" stroke-dasharray="3 3" opacity="0.25"/>

    <!-- Bear Head Totem Line Art -->
    <!-- Ears and Crown -->
    <path d="M-26 -16 C-30 -28, -22 -38, -12 -30 C-8 -34, -4 -36, 0 -36 C4 -36, 8 -34, 12 -30 C22 -38, 30 -28, 26 -16" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-23 -22 C-22 -28, -17 -30, -14 -26" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <path d="M23 -22 C22 -28, 17 -30, 14 -26" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-18" cy="-28" r="1.8" fill="#10B981"/>
    <circle cx="18" cy="-28" r="1.8" fill="#10B981"/>

    <!-- Cheeks & Muzzle Outline -->
    <path d="M-26 -16 C-34 -4, -30 12, -18 22 C-12 28, -6 36, 0 38 C6 36, 12 28, 18 22 C30 12, 34 -4, 26 -16" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Forehead Sacred Geometry -->
    <path d="M0 -34 L0 -14" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <polygon points="0,-28 5,-20 0,-12 -5,-20" stroke="#0F172A" stroke-width="1.8" fill="#EEF2FF"/>
    <circle cx="0" cy="-20" r="2.5" fill="#10B981"/>
    <path d="M-6 -24 C-10 -18, -10 -10, -6 -4" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M6 -24 C10 -18, 10 -10, 6 -4" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Eyes -->
    <polygon points="-16,-6 -8,-8 -10,-2 -18,-2" stroke="#0F172A" stroke-width="2" fill="#0F172A"/>
    <polygon points="16,-6 8,-8 10,-2 18,-2" stroke="#0F172A" stroke-width="2" fill="#0F172A"/>
    <circle cx="-13" cy="-5" r="1" fill="#FFFFFF"/>
    <circle cx="13" cy="-5" r="1" fill="#FFFFFF"/>

    <!-- Snout and Nose -->
    <path d="M-8 6 C-8 0, 8 0, 8 6 C8 14, 4 18, 0 18 C-4 18, -8 14, -8 6 Z" stroke="#0F172A" stroke-width="2" fill="#FFFFFF"/>
    <path d="M-4 6 C-4 4, 4 4, 4 6 C4 10, 1 12, 0 12 C-1 12, -4 10, -4 6 Z" fill="#0F172A"/>
    <path d="M0 12 L0 18" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
    <path d="M-5 16 C-3 18, 3 18, 5 16" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>

    <!-- Geometric Facets on Face -->
    <path d="M-24 -2 L-18 4 L-22 12" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M24 -2 L18 4 L22 12" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-16 12 L-8 16 L-12 24" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M16 12 L8 16 L12 24" stroke="#0F172A" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="30" r="2" fill="#10B981"/>
