  <!-- Typography "ficusValley" -->
  <text x="130" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="#0F172A" letter-spacing="-2px">
    ficus<tspan fill="#4F46E5">Valley</tspan>
  </text>

  <!-- Tagline "Working to build a better learning platform" -->
  <text x="132" y="98" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#475569" letter-spacing="-0.2px">
